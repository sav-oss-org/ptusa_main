[project]
name = "ptusa-lua-debugger"
version = "0.1.0"
description = "Windows Qt client for the ptusa_main Lua debugger"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pyqtgraph>=0.13.7,<0.15",
    "pyside6>=6.8,<7",
    "qt-material>=2.14,<3",
    "xlsxwriter>=3.2,<4",
]

[project.scripts]
ptusa-lua-debugger = "ptusa_lua_debugger.main:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.11,<7",
    "pytest>=8.3,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptusa_lua_debugger"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
