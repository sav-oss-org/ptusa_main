name: CMake Build Matrix

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [ master ]
  pull_request_target:
    branches: [ master ]
    types: [ labeled, opened, reopened, synchronize ]
  merge_group:
    types: [ checks_requested ]
  release:
    types: [ published ]

env:
  NINJA_VERSION: 1.10.1
  BUILD_TYPE: Release
  CCACHE_VERSION: 4.2.1
  MINGW_GCC_VERSION: 15.2.0
  MINGW_W64_VERSION: 13.0.0
  MINGW_REV: r1
  MINGW_ARCH: x86_64
  MINGW_THREAD: posix
  MINGW_EXCEPT: seh
  MINGW_CRT: ucrt

# One run per pull request at a time; other events group per git
# ref. The event name is part of the group on purpose: a burst of
# `pull_request_target` events still collapses into one queued run,
# but can no longer cancel a queued `pull_request` run of the same
# pull request (see #1617).
# Rationale and examples: #1555.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Docs-only and workflow-only pull requests skip the heavy build
  # matrix. The flags are computed by this tiny job instead of a
  # workflow-level `paths-ignore`, because that filter would prevent
  # the workflow from running at all and leave the required matrix
  # checks "Expected" forever. Jobs gated with `if:` still report
  # skipped checks, which satisfy required checks.
  docs-only:
    name: Detect docs-only or workflow-only change
    if: ${{ github.repository == 'sav-oss-org/ptusa_main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
      ci_only: ${{ steps.check.outputs.ci_only }}
      workflows_changed: ${{ steps.check.outputs.workflows_changed }}
      version_ok: ${{ steps.version.outputs.version_ok }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # pull_request_target checks out the base by default; the
          # detector must diff the pull request head instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The head ref of a fork pull request needs the explicit
          # opt-in of checkout v7 on pull_request_target; this job
          # only runs git diff on the checked metadata and executes
          # no pull request code (same pattern as sonar_build.yml).
          allow-unsafe-pr-checkout: 'true'
      - name: Check whether the change is docs- or workflow-only
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          if [ -z "$BASE_REF" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "ci_only=false" >> "$GITHUB_OUTPUT"
            echo "workflows_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          if git diff --name-only "$base" HEAD -- . \
            ':(exclude)*.md' ':(exclude)docs' | grep -q .; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
          # ci_only is true only when every changed file lives
          # under `.github`: CI configuration cannot affect
          # the compiled code or the tests.
          if git diff --name-only "$base" HEAD -- . \
            ':(exclude).github' | grep -q .; then
            echo "ci_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "ci_only=true" >> "$GITHUB_OUTPUT"
          fi
          # workflows_changed is true when any changed file lives
          # under `.github/workflows`, mixed changes included.
          if git diff --name-only "$base" HEAD -- .github/workflows \
            | grep -q .; then
            echo "workflows_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "workflows_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check release tag against CMake version
        id: version
        # Release tags carry no v prefix: the tag string must
        # equal the four-component project() version in
        # CMakeLists.txt, because that version is what the
        # binaries embed through version_info.h. A mismatch
        # fails in seconds and, through version_ok, skips the
        # expensive matrix; all other events always pass.
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "version_ok=true" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" != "release" ]; then
            exit 0
          fi
          cmake_version=$(sed -nE \
            's/^project\(ptusa_main VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          echo "CMake version: $cmake_version"
          echo "release tag:   $TAG"
          if [ -z "$cmake_version" ] || [ "$cmake_version" != "$TAG" ]; then
            echo "version_ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::release tag '$TAG' must equal the CMake" \
              "project() version '$cmake_version'" >&2
            exit 1
          fi
  # A workflow-only pull request skips the build matrix, and GitHub
  # runs the base copy of the workflow files, so nothing else would
  # parse the changed `YAML` before the merge. This cheap job parses
  # the pull-request copy with the `Psych` `YAML` parser that ships
  # with the runner image, so broken workflow syntax fails the pull
  # request instead of surprising the merge queue. Like the detector,
  # this job only reads the checked-out tree: it runs no pull
  # request scripts and uses no secrets.
  workflow-syntax:
    name: Validate workflow syntax
    needs: docs-only
    if: needs.docs-only.outputs.workflows_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Validate the pull-request copy, not the base copy that
          # GitHub already ran for this event.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Explicit checkout opt-in, same read-only pattern as the
          # `docs-only` detector above.
          allow-unsafe-pr-checkout: 'true'
      - name: Parse the changed workflow files
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          status=0
          # Read file names NUL-separated so no name can break the
          # loop; deleted files have no new syntax to validate.
          while IFS= read -r -d '' f; do
            case "$f" in
              *.yml|*.yaml) ;;
              *) continue ;;
            esac
            if [ ! -f "$f" ]; then
              echo "Skipped deleted workflow: $f"
              continue
            fi
            echo "Validating $f"
            ruby -ryaml \
              -e 'YAML.load_file(ARGV[0])' "$f" || status=1
          done < <(git diff --name-only -z "$base" HEAD -- \
            .github/workflows)
          exit "$status"
  build:
    name: ${{ matrix.config.name }}
    needs: docs-only
    if: >-
      ${{
        needs.docs-only.outputs.docs_only != 'true' &&
        needs.docs-only.outputs.ci_only != 'true' &&
        needs.docs-only.outputs.version_ok == 'true' &&
        github.repository == 'sav-oss-org/ptusa_main' &&
          (
          github.event_name == 'release' ||
          github.event_name == 'schedule' ||
          github.event_name == 'merge_group' ||
          github.event_name == 'workflow_dispatch' ||
            (
            github.event_name == 'pull_request_target' &&
            github.event.pull_request.head.repo.full_name != github.repository &&
              (
              contains(github.event.pull_request.labels.*.name, 'safe to test') ||
              github.event.pull_request.author_association == 'MEMBER' ||
              github.event.pull_request.author_association == 'OWNER'
              )
            ) ||
              (
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository
              )
          )
      }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: "Windows Latest MSVC",
            artifact: "Windows-MSVC.7z",
            os: windows-latest,
            cc: "cl",
            cxx: "cl",
            environment_script: "vcvars32.bat",
            targets: "ptusa_main libptusa_main main_test main_performance_test",
            run_tests: "true"
          }
        - {
            name: "Windows Latest MinGW",
            artifact: "Windows-MinGW.7z",
            os: windows-latest,
            cc: "gcc",
            cxx: "g++",
            targets: "ptusa_main libptusa_main",
            run_tests: "false"
          }
        - {
            name: "Ubuntu Latest GCC",
            artifact: "Linux.7z",
            os: ubuntu-latest,
            cc: "gcc",
            cxx: "g++",
            targets: "ptusa_main libptusa_main main_test main_performance_test",
            run_tests: "true"
          }

        - {
            name: "Ubuntu Latest AXCF2152 2024 LTS",
            artifact: "Linux-AXCF2152-2024.7z",
            os: ubuntu-latest,
            targets: "ptusa_main libptusa_main PtusaPLCnextEngineer",
            run_tests: "false",

            axc: "AXCF2152",
            preset: "build-linux-AXCF2152-2024-LTS-Release",
            sdk: "axcf2152-linux_sdk-2024.0.17_LTS-24.0.17.244",
            dir: "2024.0",
            plcncli: "PLCnext_Toolchain_Linux_2026.0-LTS"
          }
        - {
            name: "Ubuntu Latest AXCF2152 2026 LTS",
            artifact: "Linux-AXCF2152-2026.7z",
            os: ubuntu-latest,
            targets: "ptusa_main libptusa_main PtusaPLCnextEngineer",
            run_tests: "false",

            axc: "AXCF2152",
            preset: "build-linux-AXCF2152-2026-LTS-Release",
            sdk: "axcf2152-linux_sdk-2026.0.5_LTS-26.0.5.124",
            dir: "2026.0",
            plcncli: "PLCnext_Toolchain_Linux_2026.0-LTS"
          }

        - {
            name: "Ubuntu Latest AXCF3152 2024 LTS",
            artifact: "Linux-AXCF3152-2024.7z",
            os: ubuntu-latest,
            targets: "ptusa_main libptusa_main PtusaPLCnextEngineer",
            run_tests: "false",

            axc: "AXCF3152",
            preset: "build-linux-AXCF3152-2024-LTS-Release",
            sdk: "axcf3152-linux_sdk-2024.0.9_LTS-24.0.9.163",
            dir: "2024.0",
            plcncli: "PLCnext_Toolchain_Linux_2026.0-LTS"
          }
        - {
            name: "Ubuntu Latest AXCF3152 2026 LTS",
            artifact: "Linux-AXCF3152-2026.7z",
            os: ubuntu-latest,
            targets: "ptusa_main libptusa_main PtusaPLCnextEngineer",
            run_tests: "false",

            axc: "AXCF3152",
            preset: "build-linux-AXCF3152-2026-LTS-Release",
            sdk: "axcf3152-linux_sdk-2026.0.3_LTS-26.0.3.88",
            dir: "2026.0",
            plcncli: "PLCnext_Toolchain_Linux_2026.0-LTS"
          }

        - {
            name: "Ubuntu Latest AXCF2000 2026 LTS",
            artifact: "Linux-AXCF2000-2026.7z",
            os: ubuntu-latest,
            targets: "ptusa_main libptusa_main PtusaPLCnextEngineer",
            run_tests: "false",

            axc: "AXCF2000EA",
            preset: "build-linux-AXCF2000-2026-LTS-Release",
            sdk: "axcf2000ea-linux_sdk-2026.0.4_LTS-26.0.4.13",
            dir: "2026.0",
            plcncli: "PLCnext_Toolchain_Linux_2026.0-LTS"
          }
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        # Whether to checkout submodules: `true` to checkout submodules or `recursive` to
        # recursively checkout submodules.
        #
        # When the `ssh-key` input is not provided, SSH URLs beginning with
        # `git@github.com:` are converted to HTTPS.
        #
        # Default: false
        submodules: 'recursive'
        allow-unsafe-pr-checkout: 'true'

    - name: Download Ninja and CMake
      shell: cmake -P {0}
      run: |
        set(cmake_version ${CMAKE_VERSION})
        set(ninja_version $ENV{NINJA_VERSION})
        message(STATUS "Using host CMake version: ${CMAKE_VERSION}")
        if ("${{ runner.os }}" STREQUAL "Windows")
          set(ninja_suffix "win.zip")
          set(cmake_dir "cmake-${cmake_version}-win64-x64/bin")
        elseif ("${{ runner.os }}" STREQUAL "Linux")
          set(ninja_suffix "linux.zip")
          set(cmake_dir "cmake-${cmake_version}-Linux-x86_64/bin")
        elseif ("${{ runner.os }}" STREQUAL "macOS")
          set(ninja_suffix "mac.zip")
          set(cmake_dir "cmake-${cmake_version}-Darwin-x86_64/CMake.app/Contents/bin")
        endif()
        set(ninja_url "https://github.com/ninja-build/ninja/releases/download/v${ninja_version}/ninja-${ninja_suffix}")
        file(DOWNLOAD "${ninja_url}" ./ninja.zip SHOW_PROGRESS)
        execute_process(COMMAND ${CMAKE_COMMAND} -E tar xvf ./ninja.zip)

        # Add to PATH environment variable
        file(TO_CMAKE_PATH "$ENV{GITHUB_WORKSPACE}/${cmake_dir}" cmake_dir)
        set(path_separator ":")
        if ("${{ runner.os }}" STREQUAL "Windows")
          set(path_separator ";")
        endif()
        file(APPEND "$ENV{GITHUB_PATH}" "$ENV{GITHUB_WORKSPACE}${path_separator}${cmake_dir}")
        if (NOT "${{ runner.os }}" STREQUAL "Windows")
          execute_process(
            COMMAND chmod +x ninja
          )
        endif()

    - name: Download ccache
      if: ${{ ! matrix.config.preset }}
      id: ccache
      shell: cmake -P {0}
      run: |
        set(ccache_url "https://github.com/cristianadam/ccache/releases/download/v$ENV{CCACHE_VERSION}/${{ runner.os }}.tar.xz")
        file(DOWNLOAD "${ccache_url}" ./ccache.tar.xz SHOW_PROGRESS)
        execute_process(COMMAND ${CMAKE_COMMAND} -E tar xvf ./ccache.tar.xz)

    - name: Prepare ccache timestamp
      if: ${{ ! matrix.config.preset }}
      id: ccache_cache_timestamp
      shell: cmake -P {0}
      run: |
        string(TIMESTAMP current_date "%Y-%m-%d-%H;%M;%S" UTC)
        file(APPEND "$ENV{GITHUB_OUTPUT}" "timestamp=${current_date}\n")

    - name: ccache cache files
      if: ${{ ! matrix.config.preset }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.os == 'Windows' && format('{0}/ccache', runner.temp) || '.ccache' }}
        key: ${{ matrix.config.name }}-ccache-${{ steps.ccache_cache_timestamp.outputs.timestamp }}
        restore-keys: |
          ${{ matrix.config.name }}-ccache-

    - name: Disable man-db cache (Linux only)
      if: runner.os == 'Linux'
      run: echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections && sudo dpkg-reconfigure man-db

    - name: Install yasm
      if: ${{ ! matrix.config.preset }}
      shell: cmake -P {0}
      run: |
        if ("${{ runner.os }}" STREQUAL "Windows")
          set(yasm_url "https://www.tortall.net/projects/yasm/releases/yasm-1.2.0-win64.exe")
          set(yasm_install_path "C:/Program Files/yasm")
          file(DOWNLOAD "${yasm_url}" "${yasm_install_path}/yasm.exe" SHOW_PROGRESS)
          # Add to PATH environment variable
          file(APPEND "$ENV{GITHUB_PATH}" ";${yasm_install_path}")

        elseif ("${{ runner.os }}" STREQUAL "Linux")
          execute_process(COMMAND sudo apt-get update)
          execute_process(COMMAND sudo apt-get install -y yasm)
        endif()

    - name: Install Linux build dependencies (autotools)
      if: runner.os == 'Linux' && matrix.config.preset
      run: |
        sudo apt-get update
        sudo apt-get install -y \
        autoconf \
        automake \
        libtool \
        libltdl-dev \
        make \
        pkg-config

    - name: Install unixodbc-dev (Linux only)
      if: runner.os == 'Linux' && !matrix.config.preset
      run: sudo apt-get install -y unixodbc-dev

    - name: Install plcncli and PLCnext SDK (Linux only)
      if: runner.os == 'Linux' && matrix.config.preset
      env:
        GH_TOKEN: ${{ secrets.PLCNEXT_SDK_TOKEN }}
      shell: bash
      run: |
        set -euo pipefail

        sdk="${{ matrix.config.sdk }}"
        echo "Downloading PLCnext SDK: $sdk"
        gh release download "$sdk" \
          --repo sav-oss-org/PLCnext_bin \
          --pattern "$sdk.sh"
        chmod +x "$sdk.sh"
        ./${sdk}.sh -y -d /opt/pxc/sdks/${{ matrix.config.axc }}/${{ matrix.config.dir }}
        echo "/opt/pxc/sdks/${{ matrix.config.axc }}/${{ matrix.config.dir }}/bin" >> "$GITHUB_PATH"

        plcncli="${{ matrix.config.plcncli }}"
        echo "Downloading plcncli: $plcncli"
        gh release download "$plcncli" \
          --repo sav-oss-org/PLCnext_bin \
          --pattern "$plcncli.sh"
        chmod +x "$plcncli.sh"
        ./$plcncli.sh --quiet --accept
        sudo ln -sf "$GITHUB_WORKSPACE/PLCnext_Toolchain/plcncli" /bin/plcncli
        plcncli set setting SdkPaths -a "/opt/pxc/sdks/${{ matrix.config.axc }}/${{ matrix.config.dir }}"
        plcncli --version

    - name: Cache MinGW archive
      if: runner.os == 'Windows' && matrix.config.name == 'Windows Latest MinGW'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: mingw_cache
        key: mingw-archive-${{ env.MINGW_GCC_VERSION }}-${{ env.MINGW_W64_VERSION }}-${{ env.MINGW_REV }}-${{ env.MINGW_THREAD }}-${{ env.MINGW_EXCEPT }}-${{ env.MINGW_CRT }}

    - name: Install MinGW-w64 (Windows MinGW only)
      if: runner.os == 'Windows' && matrix.config.name == 'Windows Latest MinGW'
      shell: cmake -P {0}
      run: |
        # Параметры версии вынесены в env (см. верх файла).
        set(gcc_ver $ENV{MINGW_GCC_VERSION})
        set(w64_ver $ENV{MINGW_W64_VERSION})
        set(rev     $ENV{MINGW_REV})
        set(arch    $ENV{MINGW_ARCH})
        set(thread  $ENV{MINGW_THREAD})
        set(excepts $ENV{MINGW_EXCEPT})
        set(crt     $ENV{MINGW_CRT})

        # Формирование имени релиза и архива.
        set(release_tag "${gcc_ver}${thread}-${w64_ver}-${crt}-${rev}")
        set(filename "winlibs-${arch}-${thread}-${excepts}-gcc-${gcc_ver}-mingw-w64${crt}-${w64_ver}-${rev}.zip")
        set(mingw_w64_url "https://github.com/brechtsanders/winlibs_mingw/releases/download/${release_tag}/${filename}")

        set(zip_dir "$ENV{GITHUB_WORKSPACE}/mingw_cache")
        file(MAKE_DIRECTORY "${zip_dir}")
        set(zip_path "${zip_dir}/mingw64.zip")

        if (EXISTS "${zip_path}")
          message(STATUS "Using cached MinGW archive: ${zip_path}")
        else()
          message(STATUS "Downloading MinGW-w64: ${mingw_w64_url}")
          file(DOWNLOAD "${mingw_w64_url}" "${zip_path}" SHOW_PROGRESS)
        endif()

        # Распаковываем напрямую в C:/ чтобы избежать промежуточного копирования.
        # В архиве корневая папка 'mingw64', поэтому после распаковки будет c:/mingw64.
        execute_process(
          COMMAND ${CMAKE_COMMAND} -E tar xf "${zip_path}"
          WORKING_DIRECTORY "c:/"
        )

        # Верификация.
        if (NOT EXISTS "c:/mingw64/bin/x86_64-w64-mingw32-gcc.exe")
          message(FATAL_ERROR "x86_64-w64-mingw32-gcc.exe not found after extraction.")
        endif()

        # Диагностика: показываем обнаруженные компиляторы в PATH и версию g++.
        message(STATUS "Diagnostics: locating 'g++' and 'x86_64-w64-mingw32-gcc' and printing g++ version.")
        execute_process(COMMAND where g++)
        execute_process(COMMAND where x86_64-w64-mingw32-gcc)
        execute_process(COMMAND g++ -v)


    - name: Configure
      shell: cmake -P {0}
      run: |
        set(ENV{CC} ${{ matrix.config.cc }})
        set(ENV{CXX} ${{ matrix.config.cxx }})
        if ("${{ runner.os }}" STREQUAL "Windows" AND NOT "x${{ matrix.config.environment_script }}" STREQUAL "x")
          set(_vswhere_exe
            "C:/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe")
          execute_process(
            COMMAND "${_vswhere_exe}" -latest -property installationPath
            OUTPUT_VARIABLE _vs_path
            OUTPUT_STRIP_TRAILING_WHITESPACE
            ERROR_QUIET
            RESULT_VARIABLE _vswhere_result
          )
          if (_vswhere_result EQUAL 0 AND _vs_path)
            string(REPLACE "\\" "/" _vs_path "${_vs_path}")
            set(_env_script "${_vs_path}/VC/Auxiliary/Build/${{ matrix.config.environment_script }}")
          endif()

          execute_process(
            COMMAND "${_env_script}" && set
            OUTPUT_FILE environment_script_output.txt
          )
          file(STRINGS environment_script_output.txt output_lines)
          foreach(line IN LISTS output_lines)
            if (line MATCHES "^([a-zA-Z0-9_-]+)=(.*)$")
              set(ENV{${CMAKE_MATCH_1}} "${CMAKE_MATCH_2}")
            endif()
          endforeach()
        endif()
        set(path_separator ":")
        if ("${{ runner.os }}" STREQUAL "Windows")
          set(path_separator ";")
        endif()
        set(ENV{PATH} "$ENV{GITHUB_WORKSPACE}${path_separator}$ENV{PATH}")
        file(TO_CMAKE_PATH "$ENV{GITHUB_WORKSPACE}" ccache_basedir)
        if ("${{ runner.os }}" STREQUAL "Windows")
          file(TO_CMAKE_PATH "$ENV{RUNNER_TEMP}" runner_temp)
          set(ccache_dir "${runner_temp}/ccache")
          set(ccache_temp_dir "${runner_temp}/ccache-tmp")
          file(MAKE_DIRECTORY "${ccache_dir}" "${ccache_temp_dir}")
          set(ENV{CCACHE_TEMPDIR} "${ccache_temp_dir}")
        else()
          set(ccache_dir "${ccache_basedir}/.ccache")
          file(MAKE_DIRECTORY "${ccache_dir}")
        endif()
        set(ENV{CCACHE_BASEDIR} "${ccache_basedir}")
        set(ENV{CCACHE_DIR} "${ccache_dir}")

        if ("${{ runner.os }}" STREQUAL "Linux")
            set(ENV{CODE_COVERAGE} "ON")
        endif()

        if (NOT "x${{ matrix.config.preset }}" STREQUAL "x")
          execute_process(
            COMMAND cmake --preset ${{ matrix.config.preset }}
            RESULT_VARIABLE result
          )
        else()
          execute_process(
            COMMAND cmake
              -S .
              -B build
              -D CMAKE_BUILD_TYPE=$ENV{BUILD_TYPE}
              -G Ninja
              -D CMAKE_MAKE_PROGRAM=ninja
              -D CMAKE_C_COMPILER_LAUNCHER=ccache
              -D CMAKE_CXX_COMPILER_LAUNCHER=ccache
              -D CODE_COVERAGE=$ENV{CODE_COVERAGE}
            RESULT_VARIABLE result
          )
        endif()
        if (NOT result EQUAL 0)
          message(FATAL_ERROR "Bad exit status")
        endif()

    - name: Build
      id: cmake_build
      shell: cmake -P {0}
      run: |
        set(ENV{NINJA_STATUS} "[%f/%t %o/sec] ")
        if ("${{ runner.os }}" STREQUAL "Windows" AND NOT "x${{ matrix.config.environment_script }}" STREQUAL "x")
          file(STRINGS environment_script_output.txt output_lines)
          foreach(line IN LISTS output_lines)
            if (line MATCHES "^([a-zA-Z0-9_-]+)=(.*)$")
              set(ENV{${CMAKE_MATCH_1}} "${CMAKE_MATCH_2}")
            endif()
          endforeach()
        endif()
        file(TO_CMAKE_PATH "$ENV{GITHUB_WORKSPACE}" ccache_basedir)
        set(ccache_dir "${ccache_basedir}/.ccache")
        if ("${{ runner.os }}" STREQUAL "Windows")
          file(TO_CMAKE_PATH "$ENV{RUNNER_TEMP}" runner_temp)
          set(ccache_dir "${runner_temp}/ccache")
          set(ccache_temp_dir "${runner_temp}/ccache-tmp")
          file(MAKE_DIRECTORY "${ccache_dir}" "${ccache_temp_dir}")
          set(ENV{CCACHE_TEMPDIR} "${ccache_temp_dir}")
        else()
          file(MAKE_DIRECTORY "${ccache_dir}")
        endif()
        set(ENV{CCACHE_BASEDIR} "${ccache_basedir}")
        set(ENV{CCACHE_DIR} "${ccache_dir}")
        set(ENV{CCACHE_COMPRESS} "true")
        set(ENV{CCACHE_COMPRESSLEVEL} "6")
        set(ENV{CCACHE_MAXSIZE} "400M")
        if ("${{ matrix.config.cxx }}" STREQUAL "cl")
          set(ENV{CCACHE_MAXSIZE} "600M")
        endif()

        if (NOT "x${{ matrix.config.preset }}" STREQUAL "x")
          file(APPEND "$ENV{GITHUB_OUTPUT}"
            "build_dir=bin/build/${{ matrix.config.axc }}_${{ matrix.config.dir }}\n")

          execute_process(
            COMMAND cmake --build --preset ${{ matrix.config.preset }} --target ${{ matrix.config.targets }}
            RESULT_VARIABLE result
            OUTPUT_VARIABLE output
            ERROR_VARIABLE output
            ECHO_OUTPUT_VARIABLE ECHO_ERROR_VARIABLE
          )
        else()
          execute_process(COMMAND ccache -p)
          execute_process(COMMAND ccache -z)

          execute_process(
            COMMAND cmake --build build --target ${{ matrix.config.targets }}
            RESULT_VARIABLE result
            OUTPUT_VARIABLE output
            ERROR_VARIABLE output
            ECHO_OUTPUT_VARIABLE ECHO_ERROR_VARIABLE
          )
        endif()

        if (NOT result EQUAL 0)
          string(REGEX MATCH "FAILED:.*$" error_message "${output}")
          string(REPLACE "\n" "%0A" error_message "${error_message}")
          message("::error::${error_message}")
          message(FATAL_ERROR "Build failed")
        endif()

        if ("x${{ matrix.config.preset }}" STREQUAL "x")
          execute_process(COMMAND ccache -s)
        endif()

    # Install valgrind
    - name: Install valgrind on Linux
      if: runner.os == 'Linux' && !matrix.config.preset
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y valgrind


    - name: Run tests
      if: matrix.config.run_tests == 'true'
      shell: cmake -P {0}
      run: |
        include(ProcessorCount)
        ProcessorCount(N)
        set(ENV{CTEST_OUTPUT_ON_FAILURE} "ON")

        if ("${{ runner.os }}" STREQUAL "Windows")
          execute_process(COMMAND luarocks path --lr-path
            RESULT_VARIABLE result_path
            OUTPUT_VARIABLE output_path
            OUTPUT_STRIP_TRAILING_WHITESPACE
          )
          execute_process(COMMAND luarocks path --lr-cpath
            RESULT_VARIABLE result_cpath
            OUTPUT_VARIABLE output_cpath
            OUTPUT_STRIP_TRAILING_WHITESPACE
          )
          if (result_path EQUAL 0 AND result_cpath EQUAL 0)
            set(ENV{LUA_PATH} "${output_path}")
            set(ENV{LUA_CPATH} "${output_cpath}")
          endif()

          message("LUA_PATH=\"$ENV{LUA_PATH}\"")
          message("LUA_CPATH=\"$ENV{LUA_CPATH}\"")
        endif()

        execute_process(
          COMMAND ctest -j ${N}
          WORKING_DIRECTORY build
          RESULT_VARIABLE result
          OUTPUT_VARIABLE output
          ERROR_VARIABLE output
          ECHO_OUTPUT_VARIABLE ECHO_ERROR_VARIABLE
        )
        if (NOT result EQUAL 0)
          string(REGEX MATCH "[0-9]+% tests.*[0-9.]+ sec.*$" test_results "${output}")
          string(REPLACE "\n" "%0A" test_results "${test_results}")
          message("::error::${test_results}")
          message(FATAL_ERROR "Running tests failed!")
        endif()

    - name: Install lcov (Linux only)
      if: runner.os == 'Linux' && !matrix.config.preset
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y lcov

    - name: Create lcov report (Linux only)
      if: runner.os == 'Linux' && !matrix.config.preset
      shell: bash
      run: |
        lcov --capture --directory . --ignore-errors mismatch,inconsistent --output-file coverage.info
        lcov --remove coverage.info '/usr/*' --remove coverage.info '*/test/*' --remove coverage.info '*/googletest/*' --output-file coverage.info # filter system-files
        lcov --list coverage.info # debug info

    - name: Upload coverage to Codecov (Linux only)
      if: runner.os == 'Linux' && !matrix.config.preset
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        fail_ci_if_error: true
        verbose: true
        token: ${{ secrets.CODECOV_TOKEN }}

    - name: Store benchmark result (Linux only)
      # github-action-benchmark cannot resolve the temporary
      # merge queue ref (gh-readonly-queue/*), so skip queue runs.
      if: >-
        runner.os == 'Linux' && !matrix.config.preset &&
        github.event_name != 'merge_group'
      uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
      with:
        name: C++ Benchmark
        tool: 'googlecpp'
        output-file-path: ./build/benchmark_result.json
        gh-repository: github.com/sav-oss-org/benchmark-ptusa-main
        gh-pages-branch: main
        benchmark-data-dir-path: docs/dev/bench
        github-token: ${{ secrets.BENCHMARK_PTUSA_MAIN_TOKEN }}
        auto-push: true
        # Show alert with commit comment on detecting possible performance regression
        alert-threshold: '155%'
        comment-on-alert: true
        fail-on-alert: false
        alert-comment-cc-users: '@idzm'

    - name: Install Strip
      run: |
        cmake --install ${{ steps.cmake_build.outputs.build_dir || 'build'}} --prefix instdir --strip

    - name: Pack
      working-directory: instdir
      run: cmake -E tar cfv ../${{ matrix.config.artifact }} --format=7zip .


    - name: Upload
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        path: ./${{ matrix.config.artifact }}
        name: ${{ matrix.config.artifact }}

  # The ruleset also requires the codecov/patch commit status and the
  # three matrix build names plus the SonarCloud result. All of them
  # come from jobs that docs-only and workflow-only pull requests
  # intentionally skip: a skipped matrix job reports only the
  # unexpanded template name, and the SonarCloud action never runs
  # behind the workflow-only gate of its own workflow. This job posts
  # passing stub statuses instead, so the required contexts never sit
  # in "Expected" forever; real changes still get real reports. The
  # SonarCloud stub is limited to workflow-only changes because that
  # workflow keeps analyzing docs-only pull requests.
  codecov-docs-only:
    name: Report stubs for skipped required checks
    needs: docs-only
    # The `pull_request` copy of this workflow runs with the
    # read-only fork token and cannot post the external status;
    # only the privileged `pull_request_target` copy posts it, so
    # the stub is restricted to that event (the flags are false
    # for `push`, `schedule`, `workflow_dispatch`,
    # `merge_group`, and `release` anyway).
    if: >-
      (
      needs.docs-only.outputs.docs_only == 'true' ||
      needs.docs-only.outputs.ci_only == 'true'
      ) &&
      github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Post passing codecov/patch status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA"
          -f state=success
          -f context=codecov/patch
          -f description="Docs- or workflow-only change, no coverage impact"
          -f target_url="$RUN_URL"

      - name: Post passing statuses for the skipped required checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_ONLY: ${{ needs.docs-only.outputs.ci_only }}
        run: |
          set -eu
          post() {
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
              -f state=success -f context="$1" \
              -f description="$2" -f target_url="$RUN_URL" >/dev/null
            echo "posted passing status: $1"
          }
          matrix_desc="Docs- or workflow-only change, matrix skipped"
          post "Ubuntu Latest GCC" "$matrix_desc"
          post "Windows Latest MSVC" "$matrix_desc"
          post "Windows Latest MinGW" "$matrix_desc"
          if [ "$CI_ONLY" = "true" ]; then
            post "SonarCloud Code Analysis" \
              "Workflow-only change, no sources to analyze"
          fi
  # Cutting a release starts here: every master push extracts the
  # project() version from CMakeLists.txt and, when no release
  # carries that name yet, drafts a release. GitHub creates the
  # tag from the commit stored at draft time once the draft is
  # published, so publishing the draft is the only manual step;
  # it fires the on: release pipeline below, and the version
  # gate there can never disagree with the tag because both come
  # from the same line. Other jobs skip push events through their
  # own conditions, and the workflow concurrency block serializes
  # master pushes, so the exists-check stays race-free. The
  # --generate-notes flag fills the draft body with the list of
  # pull requests merged since the previous release (GitHub
  # groups them and links the full changelog), below the
  # one-line preamble. Publishing later does not refresh them:
  # regenerate with gh release edit --generate-notes when the
  # queue merged more pull requests in between.
  autocut-release:
    name: Draft release for a new CMake version
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Draft the release when the version is new
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          ver=$(sed -nE \
            's/^project\(ptusa_main VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          if [ -z "$ver" ]; then
            echo "::error::cannot parse the version from CMakeLists.txt" >&2
            exit 1
          fi
          echo "CMake version: $ver"
          if gh release view "$ver" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $ver exists already, nothing to draft"
            exit 0
          fi
          gh release create "$ver" --draft --target "$SHA" \
            --title "ptusa_main $ver" \
            --repo "$GITHUB_REPOSITORY" \
            --notes "Draft cut automatically from master at $SHA." \
            --generate-notes ||
            gh release view "$ver" --repo "$GITHUB_REPOSITORY" >/dev/null

  # Publishing a GitHub release (on: release, type published)
  # runs this workflow from the tag commit, so the build matrix
  # above compiles exactly the released sources. This job then
  # attaches every produced archive to that release, including
  # the PLCnext cross builds. The write-scoped token lives only
  # here: the matrix runs untrusted forks through
  # pull_request_target and must stay without contents: write.
  publish-release:
    name: Attach release archives
    needs: build
    # The build-result check keeps this job off matrices that
    # failed or were skipped, for example after a mistagged
    # release.
    if: >-
      github.event_name == 'release' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Download build archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          assets=(./dist/*/*.7z)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "no release archives were produced" >&2
            exit 1
          fi
          # The job has no checkout, so gh cannot infer the repository
          # from a git directory and needs the explicit --repo flag.
          gh release upload "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber "${assets[@]}"
