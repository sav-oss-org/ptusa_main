name: Sonar analysis
on:
  push:
    branches: [ master ]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    # Actions never run for draft pull requests, so the ready
    # transition is the first event that can report the required
    # contexts for a PR opened as a draft (#1592).
    types: [ opened, reopened, synchronize, ready_for_review ]
  pull_request_target:
    branches: [ master ]
    # `ready` mirrors `ready_for_review` for the privileged
    # copy that posts the stub statuses.
    types: [ labeled, opened, reopened, synchronize, ready ]
  merge_group:
    types: [ checks_requested ]

# One run per pull request at a time; other events group per git
# ref. The event name is part of the group on purpose: a burst of
# `pull_request_target` events still collapses into one queued run,
# but can no longer cancel a queued `pull_request` run of the same
# pull request (see #1617).
# Rationale and examples: #1555.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Docs-only and workflow-only pull requests skip this heavy
  # analysis too. The `docs-only` job of cmake.yml computes the
  # same flags, but job outputs cannot cross workflow boundaries,
  # so this workflow recomputes them with the same merge-base
  # diff semantics (#1561).
  ci-only:
    name: Detect docs-only or workflow-only change
    if: ${{ github.repository == 'sav-oss-org/ptusa_main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
      ci_only: ${{ steps.check.outputs.ci_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # pull_request_target checks out the base by default; the
          # detector must diff the pull request head instead.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Explicit checkout opt-in, same read-only pattern as the
          # `docs-only` job of cmake.yml: diff only, no pull request
          # code is executed and no secrets are used.
          allow-unsafe-pr-checkout: 'true'
      - name: Check whether the change is docs- or workflow-only
        id: check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          if [ -z "$BASE_REF" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "ci_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          # Same pattern as the `docs-only` job of cmake.yml:
          # markdown files and `docs/` cannot affect the code
          # that Sonar analyzes.
          if git diff --name-only "$base" HEAD -- . \
            ':(exclude)*.md' ':(exclude)docs' | grep -q .; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --name-only "$base" HEAD -- . \
            ':(exclude).github' | grep -q .; then
            echo "ci_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "ci_only=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    name: Build and analyze
    needs: ci-only
    if: >-
      ${{
        needs.ci-only.outputs.ci_only != 'true' &&
        needs.ci-only.outputs.docs_only != 'true' &&
        github.repository == 'sav-oss-org/ptusa_main' &&
        (
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          github.event_name == 'merge_group' ||
          (
            github.event_name == 'pull_request_target' &&
            github.event.pull_request.head.repo.full_name != github.repository &&
            (
              contains(github.event.pull_request.labels.*.name, 'safe to test') ||
              github.event.pull_request.author_association == 'MEMBER' ||
              github.event.pull_request.author_association == 'OWNER'
            )
          ) ||
          (
            github.event_name == 'pull_request' &&
            github.event.pull_request.head.repo.full_name == github.repository
          )
        )
      }}
    runs-on: ubuntu-latest
    env:
      # To see list of versions https://binaries.sonarsource.com/?prefix=Distribution/sonar-scanner-cli/
      SONAR_SCANNER_VERSION: 8.3.1.16491
      SONAR_SERVER_URL: "https://sonarcloud.io"
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory # Directory where build-wrapper output will be placed
      # ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      # Deep symbolic execution takes ~85% of the CFamily analysis time.
      # Only merge-queue runs get the shallow-mode cap, because they block
      # the merge queue; the post-merge `push` analysis keeps full depth
      # and blocks nothing. Threshold 70 is the value recommended by the
      # scanner itself and by the Sonar docs; 0 disables the cap.
      SONAR_SHALLOW_TH: ${{ github.event_name == 'merge_group' && '70' || '0' }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          submodules: 'recursive'
          ref: ${{ github.event.pull_request.head.sha }}
          allow-unsafe-pr-checkout: 'true'

      # Disable man-db cache. Install unixodbc-dev.
      - name: Install unixodbc-dev
        run: |
          echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections && sudo dpkg-reconfigure man-db
          sudo apt-get update
          sudo apt-get install -y unixodbc-dev

      - name: Setup ccache (cache restore/save)
        uses: hendrikmuhs/ccache-action@e91f31892a1d1b8c44424b1a94c0b7f52d337168 # v1.2.26
        with:
          key: ${{ runner.os }}-ccache-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-
          max-size: 500M

      - name: Download and set up sonar-scanner
        env:
          SONAR_SCANNER_DOWNLOAD_URL: https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-${{ env.SONAR_SCANNER_VERSION }}-linux-x64.zip
        run: |
          mkdir -p $HOME/.sonar
          curl -sSLo $HOME/.sonar/sonar-scanner.zip ${{ env.SONAR_SCANNER_DOWNLOAD_URL }} 
          unzip -o $HOME/.sonar/sonar-scanner.zip -d $HOME/.sonar/
          echo "$HOME/.sonar/sonar-scanner-${{ env.SONAR_SCANNER_VERSION }}-linux-x64/bin" >> $GITHUB_PATH

      - name: Download and set up build-wrapper
        env:
          BUILD_WRAPPER_DOWNLOAD_URL: ${{ env.SONAR_SERVER_URL }}/static/cpp/build-wrapper-linux-x86.zip
        run: |
          curl -sSLo $HOME/.sonar/build-wrapper-linux-x86.zip ${{ env.BUILD_WRAPPER_DOWNLOAD_URL }}
          unzip -o $HOME/.sonar/build-wrapper-linux-x86.zip -d $HOME/.sonar/
          echo "$HOME/.sonar/build-wrapper-linux-x86" >> $GITHUB_PATH

      - name: Run build-wrapper (ccache enabled)
        run: |
          mkdir build
          cmake -S . -B build -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCODE_COVERAGE=ON -DSKIP_DEMO=ON
          build-wrapper-linux-x86-64 --out-dir ${{ env.BUILD_WRAPPER_OUT_DIR }} cmake --build build/ --config Release -j"$(nproc)"

      - name: Run tests
        shell: cmake -P {0}
        run: |
          include(ProcessorCount)
          ProcessorCount(N)
          set(ENV{CTEST_OUTPUT_ON_FAILURE} "ON")          

          execute_process(
            COMMAND ctest -j ${N}
            WORKING_DIRECTORY build
            RESULT_VARIABLE result
            OUTPUT_VARIABLE output
            ERROR_VARIABLE output
            ECHO_OUTPUT_VARIABLE ECHO_ERROR_VARIABLE
            )
          if (NOT result EQUAL 0)
            string(REGEX MATCH "[0-9]+% tests.*[0-9.]+ sec.*$" test_results "${output}")
            string(REPLACE "\n" "%0A" test_results "${test_results}")
            message("::error::${test_results}")
            message(FATAL_ERROR "Running tests failed!")
          endif()

      # Run gcov to translate `.gcda` files into `.gcov` readable by humans and SonarCloud
      - name: Run gcov
        run: |
          mkdir coverage-dir
          cd coverage-dir
          find ../build -name '*.o' -type f -print | xargs gcov --preserve-paths | grep .
          echo List files
          ls -all

      - name: Run sonar-scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          sonar-scanner \
            --define sonar.host.url="${{ env.SONAR_SERVER_URL }}" \
            --define sonar.cfamily.compile-commands="${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json" \
            --define sonar.pullrequest.key=${{ github.event.pull_request.number }} \
            --define sonar.scm.revision=${{ github.event.pull_request.head.sha }} \
            --define sonar.cfamily.gcov.reportsPath="coverage-dir" \
            --define sonar.cfamily.symbolicExecution.automaticShallowModeThreshold=${{ env.SONAR_SHALLOW_TH }}
