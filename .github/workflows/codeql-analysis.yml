# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches: [ master ]
    # Documentation- and workflow-only changes cannot affect the
    # compiled-code analysis; the weekly schedule scan still
    # covers everything.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/**'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    if: github.repository == 'sav-oss-org/ptusa_main'
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'cpp' ]
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python' ]
        # Learn more:
        # https://docs.github.com/en/free-pro-team@latest/github/finding-security-vulnerabilities-and-errors-in-your-code/configuring-code-scanning#changing-the-languages-that-are-analyzed

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Whether to checkout submodules: `true` to checkout submodules or `recursive` to
        # recursively checkout submodules.
        #
        # When the `ssh-key` input is not provided, SSH URLs beginning with
        # `git@github.com:` are converted to HTTPS.
        #
        # Default: false
        submodules: 'recursive'
   
    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: ${{ matrix.language }}
        config-file: .github/codeql/codeql-config.yml
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

     # Disable man-db cache (Linux only). Install unixodbc-dev.
    - name: Install unixodbc-dev
      run: |
        echo 'man-db man-db/auto-update boolean false' | sudo debconf-set-selections && sudo dpkg-reconfigure man-db
        sudo apt-get update
        sudo apt-get install -y unixodbc-dev

    # Manual CMake configure (Release) for CodeQL to trace compilation
    - name: Configure (CMake)
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSKIP_DEMO=ON

    # Manual CMake build instead of CodeQL Autobuild
    - name: Build (CMake)
      run: |
        cmake --build build -j"$(nproc)"

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 https://git.io/JvXDl

    # ✏️ If the Autobuild fails above, remove it and uncomment the following three lines
    #    and modify them (or add more) to build your code if your project
    #    uses a compiled language

    #- run: |
    #   make bootstrap
    #   make release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        # Keep the historical category so alert
        # correlation does not change while the upload
        # moves to the filtered SARIF below.
        category: ".github/workflows/codeql-analysis.yml:analyze"
        # Write the SARIF to a known directory instead
        # of uploading it. `failure-only` uploads only
        # debug information when the job fails, which
        # is the mode meant for SARIF post-processing.
        upload: failure-only
        output: ${{ runner.temp }}/codeql-sarif

    - name: Drop vendored `deps` results from SARIF
      run: |
        # The C/C++ extractor extracts every file that
        # the traced build compiles. The `paths-ignore`
        # entries in the CodeQL config filter only the
        # analyses that run without building code, so
        # the vendored submodule results are removed
        # from the SARIF here, before it is uploaded.
        shopt -s nullglob
        sarif_dir="${RUNNER_TEMP}/codeql-sarif"
        for sarif in "${sarif_dir}"/*.sarif; do
          jq '
            def is_deps:
              ((.locations // [])[0]
               | (.physicalLocation // {})
               | (.artifactLocation // {})
               | (.uri // ""))
              | startswith("deps/")
              or contains("/deps/");
            .runs |= map(
              .results = ((.results // [])
                | map(select(is_deps | not)))
            )
          ' "${sarif}" > "${sarif}.filtered"
          mv "${sarif}.filtered" "${sarif}"
          left=$(jq '
            def is_deps:
              ((.locations // [])[0]
               | (.physicalLocation // {})
               | (.artifactLocation // {})
               | (.uri // ""))
              | startswith("deps/")
              or contains("/deps/");
            [.runs[]?.results[]? | select(is_deps)]
            | length
          ' "${sarif}")
          if [ "${left}" != "0" ]; then
            echo "deps results survived filter" >&2
            exit 1
          fi
        done

    - name: Upload filtered CodeQL results
      uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        # Same category as the analysis above, so
        # code scanning keeps matching the alerts.
        category: ".github/workflows/codeql-analysis.yml:analyze"
        sarif_file: ${{ runner.temp }}/codeql-sarif
