# Checks pull request commit messages, authors, title and touched
# files, and newly pushed tags, against the policy mirrored below.
# https://commit-check.com/
name: 'Commit check'

on:
  pull_request:
    branches: ["master"]
    # Edited titles matter because squash merges build the commit
    # message from them.
    types: [opened, synchronize, reopened, edited]
  # GitHub runs this job from the base branch's copy of the
  # workflow, so a tag gate cannot be influenced by the pull
  # request that carries the tag.
  push:
    tags: ['**']

permissions:
  # Read-only at the top level; the write access to pull
  # requests that the PR-comment step needs is scoped to that
  # one job below, per Sonar S6622.
  contents: read

env:
  # The policy is mirrored from .github/cchk.toml on purpose:
  # CCHK_* values win over the checked-out file, so a pull
  # request cannot weaken the rules it is checked against by
  # editing that config. Keep the two copies in sync; touching
  # cchk.toml stays visible in the pull request diff. Residual:
  # the top-level warn list and inherit_from are read from the
  # file only, so demotions through them remain a visible risk
  # until the tool can pin a config to a trusted revision.
  CCHK_CONVENTIONAL_COMMITS: 'false'
  CCHK_SUBJECT_CAPITALIZED: 'true'
  CCHK_SUBJECT_IMPERATIVE: 'true'
  CCHK_SUBJECT_MAX_LENGTH: '50'
  CCHK_ALLOW_WIP_COMMITS: 'false'
  CCHK_ALLOW_EMPTY_COMMITS: 'false'
  CCHK_ALLOW_MERGE_COMMITS: 'true'
  # Empty on purpose: pins the skip-list so a checked-in or
  # inherited config cannot exempt authors from the checks.
  CCHK_IGNORE_AUTHORS: ''
  CCHK_AI_ATTRIBUTION: 'disclose'
  CCHK_AI_DISCLOSURE_TRAILERS: 'AI-assisted,Co-authored-by'
  # Empty on purpose: keeps the tool's built-in known-AI list;
  # verified an empty value does not weaken CC014 detection.
  CCHK_AI_DISCLOSURE_PATTERN: ''
  # Pinned to the tool defaults these checks currently run with
  # (fixup and revert commits are accepted today), so a config
  # edit cannot flip them either way; verified env beats a
  # config that sets allow_fixup_commits = true.
  CCHK_ALLOW_FIXUP_COMMITS: 'true'
  CCHK_ALLOW_REVERT_COMMITS: 'true'
  # Opt-in checks are pinned to their off-by-default values for
  # symmetry: they cannot weaken the gate from the config file,
  # but pinning keeps the effective policy fully visible here.
  CCHK_SUBJECT_MIN_LENGTH: '0'
  CCHK_CONVENTIONAL_BRANCH: 'false'
  CCHK_FILES_MAX_SIZE: '1MB'
  CCHK_FILES_PROHIBITED_PATTERNS: >-
    *.pem,*.key,*.pfx,*.p12,.env,id_rsa*
  CCHK_FILES_MAX_PATH_LENGTH: '250'
  CCHK_TAG_REGEX: >-
    ^\d{4}\.(?:(?:[13578]|1[02])\.(?:[1-9]|[12]\d|3[01])|(?:[469]|11)\.(?:[1-9]|[12]\d|30)|2\.(?:[1-9]|1\d|2[0-9]))(?:\.[1-9]\d*)?$

jobs:
  commit-check:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Commit check'
        uses: commit-check/commit-check-action@d68e05baf9511853193e2749f8a64bf2a221619a # v2.22.0
        with:
          message: true
          # The branch rule is off in .github/cchk.toml; the
          # house style is snake_case, not Conventional Branch.
          branch: false
          author-name: true
          author-email: true
          pr-title: true
          job-summary: true
          # Skipped automatically on fork pull requests, which
          # get a read-only token; the check run still works.
          pr-comments: true
          # Report-only while the control program is under heavy
          # testing. Remove once the baseline is green, then
          # make this check required in branch protection.
          dry-run: true

      - name: 'File checks'
        # Remove continue-on-error together with dry-run above.
        continue-on-error: true
        run: |
          # Run only the sha256-pinned commit-check wheel: pip
          # refuses a mismatched digest, so CI never executes an
          # unverified package.  Dependabot bumps version and
          # digest together in the pins file below.
          python3 -m venv "$RUNNER_TEMP/cchk-venv"
          "$RUNNER_TEMP/cchk-venv/bin/pip" install --no-deps \
            --require-hashes --quiet \
            -r "$GITHUB_WORKSPACE/.github/requirements-commit-check.txt"
          cchk="$RUNNER_TEMP/cchk-venv/bin/commit-check"
          # No --no-merges: conflict resolutions in merges can
          # introduce files too, and -f handles merge commits
          # (verified against a real merge commit locally).
          for c in $(git rev-list \
              '${{ github.event.pull_request.base.sha }}..HEAD'); do
            "$cchk" -f --rev "$c"
          done

      - name: 'AI trailer pair'
        # commit-check ORs the two trailer names (CC015 needs
        # Co-authored-by in its list), so the house AND rule is
        # enforced here: a commit naming an AI tool or claiming
        # AI assistance must carry both provenance trailers.
        # Remove continue-on-error together with dry-run above.
        continue-on-error: true
        run: |
          status=0
          for c in $(git rev-list \
              '${{ github.event.pull_request.base.sha }}..HEAD'); do
            msg="$(git log -1 --format=%B "$c")"
            if printf '%s\n' "$msg" | grep -qiE \
                '^(AI-assisted:|Signed-off-by:.*(copilot|claude|chatgpt|openai|gemini|cursor|cline|devin|qoder|windsurf|zed ai))|Co-authored-by:.*(copilot|claude|chatgpt|openai|gemini|cursor|cline|devin|qoder|windsurf|zed ai)|generated (with|by)[^"]*(copilot|claude|chatgpt|openai|gemini|cursor|cline|devin|qoder|windsurf|zed ai| ai )'; then
              if ! printf '%s\n' "$msg" | grep -q '^AI-assisted:' ||
                 ! printf '%s\n' "$msg" | grep -q '^Co-authored-by:'; then
                echo "::error::$(git log -1 --format=%h "$c"): AI commits need both AI-assisted and Co-authored-by trailers"
                status=1
              fi
            fi
          done
          exit "$status"

  tag-check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout tag'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Tag check'
        run: |
          # Install from the same sha256 pins as the pull-request
          # job above.
          python3 -m venv "$RUNNER_TEMP/cchk-venv"
          "$RUNNER_TEMP/cchk-venv/bin/pip" install --no-deps \
            --require-hashes --quiet \
            -r "$GITHUB_WORKSPACE/.github/requirements-commit-check.txt"
          "$RUNNER_TEMP/cchk-venv/bin/commit-check" --tag
