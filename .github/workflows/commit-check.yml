# Checks every pull request's commit messages, authors, and title
# against the policy in .github/cchk.toml.  https://commit-check.com/
name: 'Commit check'

on:
  pull_request:
    branches: ["master"]
    # Edited titles matter because squash merges build the commit
    # message from them.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  commit-check:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 'Commit check'
        uses: commit-check/commit-check-action@d68e05baf9511853193e2749f8a64bf2a221619a # v2.22.0
        with:
          message: true
          # The branch rule is off in .github/cchk.toml; the house
          # style is snake_case, not Conventional Branch.
          branch: false
          author-name: true
          author-email: true
          pr-title: true
          job-summary: true
          # Skipped automatically on fork pull requests, which get
          # a read-only token; the check run still works there.
          pr-comments: true
          # Report-only while the control program is under heavy
          # testing. Remove once the baseline is green, then make
          # this check required in branch protection.
          dry-run: true
