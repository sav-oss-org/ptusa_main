# CodeQL analysis scope for ptusa_main.
#
# The paths-ignore entries drop third-party code from the
# analysis results. The traced build stays complete, so
# first-party analysis is unaffected; only findings inside
# vendored trees stop being reported, and those trees are the
# responsibility of their upstream projects. The filter applies
# to every scan: pull requests, master pushes, and the weekly
# schedule.
name: ptusa_main CodeQL config
paths-ignore:
  # Git submodules: benchmark, googletest, open62541, lua,
  # zlib, fmt, cxxopts, subhook, toluapp, lunarmodules.
  - deps/**
  # Vendored tolua++ binding layer. CodeQL filter
  # patterns do not support the `+` character, so the
  # directory is matched by its `toloa` prefix: it is
  # the only entry under `PAC/common` starting with it.
  - PAC/common/toloa*/**
